# ==============================================================================
# FreightIQ Production Nginx Virtual Host Configuration
# Domain: rajvardhansinghrathore.in / www.rajvardhansinghrathore.in
# Environment: AWS Lightsail Ubuntu 22.04 LTS behind Cloudflare Proxy
# ==============================================================================

# 1. Cloudflare Real IP Restoration
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# 2. HTTP (Port 80) -> Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rajvardhansinghrathore.in www.rajvardhansinghrathore.in;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/freightiq;
    }

    location / {
        return 301 https://rajvardhansinghrathore.in$request_uri;
    }
}

# 3. Canonical Redirect: www -> non-www over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rajvardhansinghrathore.in;

    ssl_certificate /etc/letsencrypt/live/rajvardhansinghrathore.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajvardhansinghrathore.in/privkey.pem;

    return 301 https://rajvardhansinghrathore.in$request_uri;
}

# 4. Main Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rajvardhansinghrathore.in;

    root /var/www/freightiq;
    index index.html;

    # SSL Certificate Configuration (Let's Encrypt Origin)
    ssl_certificate /etc/letsencrypt/live/rajvardhansinghrathore.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajvardhansinghrathore.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Clean URL handling (extensionless URLs e.g. /data-quality/dimensions)
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Static Assets Caching (CSS, JS, Fonts, Images)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Custom 404 Error Page
    error_page 404 /index.html;
}
